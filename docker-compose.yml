services:
  db:
    image: postgis/postgis:16-3.4
    container_name: civic_spark_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: civic_spark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civic_spark"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civic_spark_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/civic_spark
      - DATABASE_URL_SYNC=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/civic_spark
      - JWT_SECRET=${JWT_SECRET}
      - VOUCHER_ENCRYPTION_KEY=${VOUCHER_ENCRYPTION_KEY}
      - UPLOAD_DIR=/app/uploads
      - ENVIRONMENT=development
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./db:/db:ro

volumes:
  pgdata:
